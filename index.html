<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breathing Setup</title>
<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f0fff3;
}
input, button {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  font-size: 18px;
  border-radius: 10px;
  border: 1px solid #aaa;
}
button {
  background: #009944;
  color: white;
  border: none;
}
</style>
</head>

<body>

<h2>Breathing Configuration</h2>

<label>In (seconds)</label>
<input id="inTime" type="number" value="7">

<label>Hold (seconds)</label>
<input id="holdTime" type="number" value="7">

<label>Out (seconds)</label>
<input id="outTime" type="number" value="6">

<button onclick="confirmConfig()">Confirm</button>

<script>
function confirmConfig() {
  const i = document.getElementById("inTime").value;
  const h = document.getElementById("holdTime").value;
  const o = document.getElementById("outTime").value;

  window.location.href =
    "session.html?in=" + i + "&hold=" + h + "&out=" + o;
}
</script>

</body>
</html>
