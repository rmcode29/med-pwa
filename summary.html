<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Summary</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h2 { margin-bottom: 20px; }
  p { font-size: 20px; margin: 10px 0; }
  button {
    padding: 14px 20px;
    margin-top: 20px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #008c3c;
    color: white;
  }
</style>
</head>
<body>

<h2>Session Summary</h2>

<p id="cyclesText"></p>
<p id="timeText"></p>

<button onclick="goBack()">Back to Start</button>

<script>
const IN_TIME = 7;   // seconds
const HOLD_TIME = 7; // seconds
const OUT_TIME = 6;  // seconds

function goBack() {
  location.href = "index.html";
}

// Get cycles from session
let cycles = parseInt(localStorage.getItem("sessionCycles"));
if (!cycles || isNaN(cycles)) cycles = 0;

// Compute total time in seconds
let totalSeconds = cycles * (IN_TIME + HOLD_TIME + OUT_TIME);

// Convert to minutes:seconds
let minutes = Math.floor(totalSeconds / 60);
let seconds = totalSeconds % 60;

document.getElementById("cyclesText").innerText = `Cycles completed: ${cycles}`;
document.getElementById("timeText").innerText = `Total session time: ${minutes} min ${seconds} sec`;

</script>
</body>
</html>
