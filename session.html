<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breathing Session</title>
<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f0fffa;
  text-align: center;
}
#status {
  margin-top: 20px;
  font-size: 32px;
  font-weight: bold;
}
#cycle {
  margin-top: 10px;
  font-size: 20px;
  color: #555;
}
button {
  width: 100%;
  padding: 16px;
  margin: 12px 0;
  font-size: 18px;
  border-radius: 10px;
  border: none;
}
#startBtn { background: #0077cc; color: white; }
#stopBtn { background: #cc0000; color: white; }
#backBtn { background: #666; color: white; }
</style>
</head>

<body>

<h2>Breathing Session</h2>

<div id="status">Ready</div>
<div id="cycle">Cycle: 0</div>

<button id="startBtn">Start Session</button>
<button id="stopBtn">Stop</button>
<button id="backBtn" onclick="goBack()">Back</button>

<script>
let wakeLock = null;

async function enableWakeLock() {
  try {
    wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) {
    console.log("WakeLock not supported:", e);
  }
}

let running = false;
let cycleCount = 0;

// get URL parameters
const url = new URLSearchParams(window.location.search);
const inT = Number(url.get("in"));
const holdT = Number(url.get("hold"));
const outT = Number(url.get("out"));

function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);
  msg.rate = 0.9;
  msg.pitch = 1;
  msg.volume = 1;
  speechSynthesis.speak(msg);
}

async function runPhase(label, seconds) {
  document.getElementById("status").innerText = label;

  speak(label);

  for (let i = 1; i <= seconds; i++) {
    if (!running) return;
    speak(i.toString());
    await new Promise(r => setTimeout(r, 1000));
  }
}

async function startSession() {
  if (running) return;

  await enableWakeLock();

  running = true;
  cycleCount = 0;

  const startTime = Date.now();

  while (running) {
    await runPhase("In", inT);
    if (!running) break;

    await runPhase("Hold", holdT);
    if (!running) break;

    await runPhase("Out", outT);
    if (!running) break;

    cycleCount++;
    document.getElementById("cycle").innerText = "Cycle: " + cycleCount;
  }

  const endTime = Date.now();
  const mins = Math.floor((endTime - startTime) / 60000);
  const secs = Math.floor((endTime - startTime) / 1000) % 60;

  window.location.href =
    "summary.html?cycles=" + cycleCount +
    "&min=" + mins +
    "&sec=" + secs +
    "&in=" + inT +
    "&hold=" + holdT +
    "&out=" + outT;
}

function stopSession() {
  running = false;
}

function goBack() {
  window.location.href = "index.html";
}

document.getElementById("startBtn").onclick = startSession;
document.getElementById("stopBtn").onclick = stopSession;
</script>

</body>
</html>
