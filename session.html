<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breathing Session</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2fff2;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h2 { margin-bottom: 10px; }
  #display {
    font-size: 38px;
    font-weight: bold;
    margin-top: 30px;
  }
  #cycleCount {
    margin-top: 10px;
    font-size: 18px;
    color: #444;
  }
  button {
    width: 90%;
    padding: 16px;
    margin: 10px auto;
    display: block;
    font-size: 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
  }
  #startBtn { background: #008c3c; color: white; }
  #stopBtn { background: #cc0000; color: white; }
  #backBtn { background: #666; color: white; }
</style>
</head>
<body>

<h2>Breathing Session</h2>

<div id="display">Ready</div>
<div id="cycleCount">Cycles: 0</div>

<button id="startBtn">Start Session</button>
<button id="stopBtn">Stop</button>
<button id="backBtn" onclick="goBack()">Back</button>

<script>
/* --- iOS Safari / Chrome Voice Fix --- */
let voicesReady = false;
async function loadVoices() {
  return new Promise(resolve => {
    const v = speechSynthesis.getVoices();
    if (v.length) {
      voicesReady = true;
      resolve();
    } else {
      speechSynthesis.onvoiceschanged = () => { voicesReady = true; resolve(); };
    }
  });
}

/* --- Wake Lock to prevent screen from locking --- */
let wakeLock = null;
async function enableWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch(e) { console.log("WakeLock not available:", e); }
}
document.addEventListener("visibilitychange", async () => {
  if (wakeLock !== null && document.visibilityState === "visible") enableWakeLock();
});

/* --- Speech function --- */
function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  if (voices.length > 0) msg.voice = voices[0];
  msg.rate = 0.85;
  msg.pitch = 0.9;
  msg.volume = 1;
  speechSynthesis.cancel();
  speechSynthesis.speak(msg);
}

/* --- Breathing session logic --- */
let running = false;
let cycle = 0;

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

async function startBreathing() {
  if (running) return;
  running = true;
  cycle = 0;

  enableWakeLock();

  while (running) {
    document.getElementById("display").innerText = "In";
    speak("In");
    await wait(7000);
    if (!running) break;

    document.getElementById("display").innerText = "Hold";
    speak("Hold");
    await wait(7000);
    if (!running) break;

    document.getElementById("display").innerText = "Out";
    speak("Out");
    await wait(6000);
    if (!running) break;

    cycle++;
    document.getElementById("cycleCount").innerText = "Cycles: " + cycle;
  }
}

/* --- Stop Session --- */
function stopBreathing() {
  running = false;
  speechSynthesis.cancel();
  document.getElementById("display").innerText = "Stopped";

  if (wakeLock) { wakeLock.release(); wakeLock = null; }

  // Go to summary page automatically
  localStorage.setItem("sessionCycles", cycle);
  location.href = "summary.html";
}

/* --- Back to Index --- */
function goBack() {
  running = false;
  speechSynthesis.cancel();
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  location.href = "index.html";
}

/* --- Start button with iOS Voice fix --- */
document.getElementById("startBtn").onclick = async () => {
  await loadVoices();
  startBreathing();
};

document.getElementById("stopBtn").onclick = stopBreathing;

</script>
</body>
</html>
