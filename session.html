<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breathing Session</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2fff2;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  h2 { margin-bottom: 10px; }
  #display {
    font-size: 38px;
    font-weight: bold;
    margin-top: 30px;
  }
  #cycleCount {
    margin-top: 10px;
    font-size: 18px;
    color: #444;
  }
  button {
    width: 90%;
    padding: 16px;
    margin: 10px auto;
    display: block;
    font-size: 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
  }
  #startBtn { background: #008c3c; color: white; }
  #stopBtn { background: #cc0000; color: white; }
  #backBtn { background: #666; color: white; }
</style>
</head>
<body>

<h2>Breathing Session</h2>

<div id="display">Ready</div>
<div id="cycleCount">Cycles: 0</div>

<button id="startBtn">Start Session</button>
<button id="stopBtn">Stop</button>
<button id="backBtn" onclick="goBack()">Back</button>

<script>
let running = false;
let cycle = 0;

// Default timings in seconds
const IN_TIME = 7;
const HOLD_TIME = 7;
const OUT_TIME = 6;

// Wake Lock to prevent screen sleep
let wakeLock = null;
async function enableWakeLock() {
  try {
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
  } catch(e){ console.log("WakeLock unavailable:", e); }
}
document.addEventListener("visibilitychange", async () => {
  if (wakeLock && document.visibilityState === "visible") enableWakeLock();
});

// Load voices for iOS
let voicesLoaded = false;
async function loadVoices() {
  return new Promise(resolve => {
    let v = speechSynthesis.getVoices();
    if (v.length) { voicesLoaded = true; resolve(); }
    else speechSynthesis.onvoiceschanged = () => { voicesLoaded = true; resolve(); };
  });
}

// Speak helper
function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  if (voices.length > 0) msg.voice = voices[0];
  msg.rate = 0.8;
  msg.pitch = 0.9;
  msg.volume = 1;
  speechSynthesis.speak(msg);
}

// Wait helper
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

// Counted phase: speak label once, then numbers
async function countPhase(label, seconds) {
  if (!running) return;
  document.getElementById("display").innerText = label;
  speak(label);
  await wait(700); // slight pause after label

  for (let i = 1; i <= seconds; i++) {
    if (!running) break;
    document.getElementById("display").innerText = `${label} ${i}`;
    speak(`${i}`);
    await wait(1000);
  }
}

// Start session
async function startBreathing() {
  if (running) return;
  running = true;
  cycle = 0;
  enableWakeLock();

  while (running) {
    await countPhase("In", IN_TIME);
    if (!running) break;

    await countPhase("Hold", HOLD_TIME);
    if (!running) break;

    await countPhase("Out", OUT_TIME);
    if (!running) break;

    cycle++;
    document.getElementById("cycleCount").innerText = "Cycles: " + cycle;
  }
}

// Stop session
function stopBreathing() {
  running = false;
  speechSynthesis.cancel();
  document.getElementById("display").innerText = "Stopped";
  if (wakeLock) { wakeLock.release(); wakeLock = null; }

  // Store cycles for summary
  localStorage.setItem("sessionCycles", cycle || 0);
  location.href = "summary.html";
}

// Back to index
function goBack() {
  running = false;
  speechSynthesis.cancel();
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
  location.href = "index.html";
}

// Button events
document.getElementById("startBtn").onclick = async () => {
  await loadVoices();
  startBreathing();
};
document.getElementById("stopBtn").onclick = stopBreathing;

</script>
</body>
</html>
