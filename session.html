<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoga Breathing App - Session</title>
<style>
body{font-family:Arial,sans-serif;background:#f2fff2;margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;}
.container{width:100%;max-width:380px;text-align:center;}
h2,h3{text-align:center;}
button{width:100%;padding:12px;margin:6px 0;border-radius:10px;font-size:18px;border:none;cursor:pointer;}
#startSessionBtn{background:#00a03e;color:white;}
#stopBtn{background:#cc0000;color:white;}
#backBtn{background:#555;color:white;}
#display{font-size:28px;margin:15px 0;height:40px;}
#cycleCount{font-size:16px;margin-bottom:15px;}
</style>
</head>
<body>
<div class="container">
<h2>Breathing Session</h2>
<div id="display">Ready</div>
<div id="cycleCount">Cycles: 0</div>
<button id="startSessionBtn">Start Session</button>
<button id="stopBtn">Stop</button>
<button id="backBtn">Back to Config</button>
<h3 id="summaryText"></h3>
</div>

<script>
let running=false;
let cycle=0;
let startTime;
const synth=window.speechSynthesis;

// Parse query params
function getQueryParams(){
  const params={};
  location.search.substr(1).split("&").forEach(pair=>{
    const [key,val]=pair.split("=");
    params[key]=val;
  });
  return params;
}

const config=getQueryParams();
const inC=Number(config.in)||4;
const holdC=Number(config.hold)||2;
const outC=Number(config.out)||4;
const soundOption=config.sound||"voice";

// Helper delay
function wait(sec){return new Promise(res=>setTimeout(res,sec*1000));}

// Speak text if voice option
function speak(text){
  if(soundOption!=="voice") return;
  const utter=new SpeechSynthesisUtterance(text);
  utter.volume=0.7; utter.rate=0.7; utter.pitch=0.6;
  synth.speak(utter);
}

// Tone generator
function playTone(duration=0.8){
  if(soundOption!=="tone") return;
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.value=440;
  gain.gain.setValueAtTime(0.1,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime+duration);
}

// Counted phase
async function countedPhase(label, seconds){
  document.getElementById("display").innerText=label;
  speak(label);
  playTone(0.8);
  for(let i=1;i<=seconds && running;i++){await wait(1);}
}

// Start breathing session
async function startSession(){
  running=true;
  cycle=0;
  startTime=new Date();
  document.getElementById("startSessionBtn").disabled=true;

  while(running){
    await countedPhase("In", inC);
    if(!running) break;
    await countedPhase("Hold", holdC);
    if(!running) break;
    await countedPhase("Out", outC);
    if(!running) break;
    cycle++;
    document.getElementById("cycleCount").innerText="Cycles: "+cycle;
  }
  showSummary();
}

// Stop
function stopSession(){
  running=false;
  synth.cancel(); // stop any ongoing speech
}

// Summary
function showSummary(){
  const endTime=new Date();
  const mins=Math.round((endTime-startTime)/60000);
  document.getElementById("summaryText").innerText=`Completed Cycles: ${cycle}\nTotal Time: ${mins} min`;
}

// Event listeners
document.getElementById("startSessionBtn").addEventListener("click",()=>startSession());
document.getElementById("stopBtn").addEventListener("click",stopSession);
document.getElementById("backBtn").addEventListener("click", ()=>{
  if(running){
    running=false;
    synth.cancel();
  }
  window.location.href = "index.html"; // go back to config
});
</script>
</body>
</html>
